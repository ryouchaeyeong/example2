<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 첫 웹사이트</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #4A90E2;
            margin-bottom: 10px;
        }
        p {
            line-height: 1.6;
            color: #666;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background-color: #4A90E2;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>환영합니다!</h1>
        <p>HTML 파일 하나로 구성된 간단한 웹페이지 샘플입니다.</p>
        <button onclick="alert('안녕하세요!')">클릭해보세요</button>
    </div>

</body>
</html>
